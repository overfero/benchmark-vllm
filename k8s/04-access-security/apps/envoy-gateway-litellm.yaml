# Real ingress for LiteLLM via Envoy Gateway - before this, Envoy Gateway's
# controller was installed but had no GatewayClass/Gateway/HTTPRoute at all
# (confirmed: `kubectl get gatewayclass` returned nothing), so it was
# genuinely idle despite being deployed. GatewayClass+Gateway are Envoy
# Gateway's own documented quickstart shape (gateway.envoyproxy.io docs,
# matching the installed chart version v1.9.2 exactly:
# github.com/envoyproxy/gateway/releases/download/v1.9.2/quickstart.yaml) -
# applying a Gateway makes the controller spin up its own dedicated proxy
# Deployment+Service automatically, separate from the controller's own
# admin/xds Service.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: litellm-gateway
  namespace: litellm
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm-route
  namespace: litellm
spec:
  parentRefs:
    - name: litellm-gateway
  hostnames:
    - "litellm.local"
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: litellm
          port: 4000
      matches:
        - path:
            type: PathPrefix
            value: /
